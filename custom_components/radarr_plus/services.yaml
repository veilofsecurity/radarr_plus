get_movies:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: radarr_plus

get_queue:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: radarr_plus
    max_items:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 500
          mode: box

get_missing_movies:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: radarr_plus
    days:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 3650
          mode: box

search_movies:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: radarr_plus
    movie_ids:
      required: true
      example: "[101, 102, 103]"
      selector:
        object:
